services:
  # Database Service
  postgres_db:
    image: postgres:15-alpine
    container_name: hospital_db_container
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # Map to 5433 to avoid conflict with local DB
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build: .
    container_name: hospital_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/hospital_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - hospital_network

  # Frontend Service
  frontend:
    build: ./frontend
    container_name: hospital_frontend
    ports:
      - "80:80" # Access via http://localhost
    depends_on:
      - backend
    networks:
      - hospital_network

volumes:
  db_data:

networks:
  hospital_network:
    driver: bridge
